name: Publish capability package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run package

      - name: Generate catalog and Pages site
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          npm run catalog -- --base-url "$BASE_URL"
          mkdir -p site
          cp artifacts/modular-anatomy/catalog.json site/catalog.json
          node --input-type=module -e "import {readFile,copyFile} from 'node:fs/promises'; const r=JSON.parse(await readFile('artifacts/modular-anatomy/release.json','utf8')); await copyFile(r.archive, 'site/modular-anatomy-'+r.version+'.zip');"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
